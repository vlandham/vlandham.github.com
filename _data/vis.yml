- id: stocks
  title: "Stock Display"
  year: 2015
  url: "/stock_display/"
  image: /images/vis/banners/stocks.png
  image_size: [1600, 200]
  alt: "Row of small area charts of stock prices labeled with ticker symbols"
  description: |
    An interactive exploration of a set of stocks in a hypothetical portfolio

- id: stereotropes
  title: "Stereotropes"
  year: 2015
  url: "https://web.archive.org/web/20150813075749/http://stereotropes.bocoup.com/"
  archived: true
  image: /images/vis/banners/stereotropes.png
  image_size: [1600, 200]
  alt: "Adjectives such as ancient, bad, and terrible linked to character tropes"
  description: |
    A piece by the Bocoup Data Vis Team, which I am fortunate to be a part of. Stereotropes looks at the words used to describe film and TV tropes and visualizes this language along gender lines. This free-form exploration of adjectives and gender provides interesting insights into what these tropes mean to us when they are used. Also, enjoy our [Stereotropes design post](https://web.archive.org/web/20160412153238/https://bocoup.com/weblog/stereotropes-design), which covers a lot of how we approached this topic and how the visuals came to be.

- id: vintage_bump_chart
  title: "Vintage Bump Chart in Code"
  year: 2015
  featured: true
  url: "/census_bump/"
  image: /images/vis/banners/bumpchart.png
  image_size: [1600, 200]
  alt: "Vintage-style bump chart with ranked bands crossing between columns"
  description: |
    Implementing classic visualizations is always a fun experience for me - and this crazy bump chart was no exception! The visualization was produced originally for the US Statistical Atlas of 1890 by Henry Gannett and shows the top cities by population, with data from over 100 years! Lessons learned from implementing this can be found in my [writeup on Bocoup's blog](https://web.archive.org/web/20160528171847/https://bocoup.com/weblog/vintage-visualization-restoration-bump-chart).

- id: experiments
  title: "Experiments!"
