# Entries for /vis/, newest first. `description` is Markdown.

- id: seriesheat
  title: "SeriesHeat"
  year: 2021
  featured: true
  url: "/seriesheat"
  image: /images/vis/banners/seriesheat.jpg
  image_size: [1400, 400]
  alt: "Heatmap of TV episode ratings, with seasons as rows and episodes as columns"
  description: |
    Using data from IMDb, this project allows people to explore average ratings of any TV Series made. Simply type in a TV Show and get a heatmap of seasons vs episodes. Its just that easy! The visualization approach was inspired by a static display showing how Simpson's episodes had degraded over time. Here, I wanted to expand that insight to any show out there.

- id: sundry
  title: "Sundry"
  year: 2021
  url: "/projects/sundry.html"
  image: /images/vis/banners/sundry.jpg
  image_size: [1200, 193]
  alt: "Density chart of model performance for one data cluster"
  description: |
    A hack-week project to try to replicate some of Uber Manifold's capabilities in visualizing the performance of multiple statistical models. The novelity of this approach is in its use of input data clusters to compare model results.

- id: process_simulation
  title: "Process Simulation Animation"
  year: 2020
  featured: true
  url: "/process_simulation/"
  image: /images/vis/banners/process_simulation.jpg
  image_size: [1602, 400]
  alt: "Colored particles flowing from a circle into grids of dots representing process phases"
  description: |
    How can we explain complex processes where items move between many different categories? One way is through animation! This ambiguous visualization shows an example of many particles moving through multiple phases of a process at different rates.

- id: good_government
  title: "Good Governments Help People Succeed"
  year: 2019
  url: "/world_gov_challenge/"
  image: /images/vis/banners/good_government.jpg
  image_size: [1600, 400]
  alt: "Orange connected scatterplot lines tracing countries' metrics over time"
  description: |
    My entry for the [World Data Visualization Prize](https://web.archive.org/web/20230320095759/https://wdvp.worldgovernmentsummit.org/). This interactive provides a way to explore countries through metrics related to both country power and progress, as well as individual human growth and opportunity. Through the use of lots and lots of connected scatterplots, we find that governments can achieve success in being good for both the individuals being governed, and good in the amount of wealth produced.
  links:
    - label: "R Notebook Analysis"
      url: "/world_gov_challenge/analysis.nb.html"
    - label: "Source Code"
      url: "https://github.com/vlandham/world_gov_challenge"

- id: quickdraw
  title: "Quick Draw Visualization"
  year: 2017
  featured: true
  url: "/quickdraw/"
  image: /images/vis/banners/quickdraw.jpg
  image_size: [1600, 391]
  alt: "Four histograms comparing drawing times for different Quick Draw doodles"
  description: |
    A fun visual exploration of the Google's newly released [Quick Draw dataset](https://quickdraw.withgoogle.com/data). This work focuses on the amount of time doodlers spent drawing a variety of draw categories. Check it out to enjoy the linked histograms and be surprised by the results!

- id: kungfu
  title: "Kung Fu Film Data Exploration"
  year: 2017
  url: "/shaw_bros_analysis.html"
  image: /images/vis/banners/kungfu.jpg
  image_size: [1275, 250]
  alt: "Network of kung fu actors, with lines connecting Ku Feng to films and co-stars"
  description: |
    This data exploration project looks at the rich and complex history of classic Kung Fu films from the Shaw Brothers film studio. This non-serious dataset is used to demonstrate a number of techniques: Using R for data exploration and analysis, creating interactive networks of social graphs, and using Word2Vec for a bit of text generative fun.

- id: mlab
  title: "Measurement Lab Visualization"
  year: 2017
  url: "https://bocoup.com/blog/visualizing-the-health-of-the-internet-with-measurement-lab"
  image: /images/vis/banners/mlab.jpg
  image_size: [1800, 595]
  alt: "Dashboard of Internet speed line charts with a filter sidebar"
  description: |
    How do you visualize the "Health of the Internet"? That was the challenge posed Bocoup Data Vis by the non-profit Measurement Lab. To answer this question, we got a chance to flex our _Big Data_ chops, needing to aggregate over 800 million Internet speed tests into city, state, and country level statistics. We used BigQuery, Google Dataflow, and Bigtable to query, wrangle, and store the data needed to power this visualization. The end result is an interactive tool that can be used by consumers and researchers to explore, discover, and research Internet help problems.

- id: cancerbrowser
  title: "HMS Cancer Browser"
  year: 2016
  url: "https://www.cancerbrowser.org"
  image: /images/vis/banners/cancerbrowser.jpg
  image_size: [1599, 200]
  alt: "Bar chart comparing protein levels for genes like EpCAM, Akt, and ErbB3"
  description: |
    Bocoup Collaborated with the Harvard Medical School to create an interactive tool for exploring and connecting a number datasets around various types of breast cancer cell lines.

    We were able to quickly create a functional tool that is expandable enough to allow for additional datasets to be added in the future. It was a lot of fun working in the bioinformatic domain, creating an interactive tool for scientists to use to discover novel connections between drugs and cancer cell types.

- id: nplegends
  title: "NP Legends"
  year: 2016
  url: "/nplegends/"
  image: /images/vis/banners/nplegends.jpg
  image_size: [1600, 200]
  alt: "Grid of National Park map symbols such as picnic tables, parking, and campgrounds"
  description: |
    This experiment started with that age-old question: "What symbols are used the most often in National Park maps?"

    I know you, like myself, have had this thought in your head at least a dozen times in your life. NP Legends serves to begin to provide an answer on this very important topic.

- id: openvis_tweets
  title: "OpenVis Conf Tweets"
  year: 2016
  url: "/openvis_tweets/"
  image: /images/vis/banners/openvis_tweets.jpg
  image_size: [1600, 200]
  alt: "Clusters of green circles showing tweet activity over time"
  description: |
    What are folks tweeting about [OpenVis Conf](https://openvisconf.com/) speakers? What content from OpenVis Conf speakers is most popular?

- id: textarc
  title: "TextArc in D3"
  year: 2016
  url: "/textarc/"
  image: /images/vis/banners/textarc.jpg
  image_size: [1600, 200]
  alt: "Words from a text scattered in white on a black background, TextArc style"
  description: |
    Awhile ago for fun I implemented part of a [classic text visualization](https://web.archive.org/web/20201120101309/http://textarc.org/) using JavaScript. [Check it out here!](/textarc/).

- id: buoyant
  title: "Buoyant Microservice Prototype"
  year: 2016
  url: "https://bocoup.com/work/buoyant"
  image: /images/vis/banners/buoyant.jpg
  image_size: [1600, 200]
  alt: "Blue and orange lines flowing through a circle labeled events"
  description: |
    As part as my role as a data visualization and open web engineer at [Bocoup](https://bocoup.com/), I got a chance to to work on a prototype for visualizing network traffic and communication channels in micro-service networks to be used as part of [Buoyant's Microservice Tools](https://buoyant.io/). Read more on our [case study](https://bocoup.com/work/buoyant).

    [Buoyant Prototype Case Study](https://bocoup.com/work/buoyant)

- id: speaker_web
  title: "Web of Speakers"
  year: 2015
  url: "/speaker_web/"
  image: /images/vis/banners/speaker_web.png
