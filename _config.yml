source: .
destination: ./_site
includes: ./_includes
url: "https://vallandingham.me"

permalink: /:title.html

#base_url: http://vlandham.com
#base_url: /
description: "Data visualization, tutorials, and projects by Jim Vallandingham."

# Cloudflare Web Analytics site token (Cloudflare dashboard → Web Analytics).
# The beacon only loads in production builds when this is set.
cloudflare_analytics_token: "2b4df352ecf04cab9fc322e072c3ef88"

encoding: utf-8
timezone: UTC

defaults:
  - scope:
      path: ""
    values:
      ogtype: "website"
  - scope:
      path: ""
      type: "posts"
    values:
      ogtype: "article"
